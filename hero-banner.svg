<svg width="920" height="340" viewBox="0 0 920 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0D1526" />
      <stop offset="100%" stop-color="#0A0E1A" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11192C" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B101D" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing border -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Accent text gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Ambient glow filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45" result="blur" />
    </filter>

    <!-- Dot Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" fill-opacity="0.7" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 0.9; }
      100% { opacity: 0.4; }
    }
    .pulsing-dot {
      animation: pulse 2.5s infinite ease-in-out;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="920" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="160" cy="80" r="90" fill="#0284C7" fill-opacity="0.18" filter="url(#glow-cyan)" />
  <circle cx="760" cy="180" r="110" fill="#4F46E5" fill-opacity="0.15" filter="url(#glow-purple)" />
  <circle cx="420" cy="280" r="80" fill="#0EA5E9" fill-opacity="0.12" filter="url(#glow-cyan)" />

  <!-- Dot Grid Overlay -->
  <rect width="920" height="340" rx="16" fill="url(#dot-grid)" />

  <!-- Outer Glass Frame -->
  <rect x="12" y="12" width="896" height="316" rx="12" fill="none" stroke="#1E293B" stroke-width="1" />
  <rect x="12" y="12" width="896" height="316" rx="12" fill="none" stroke="url(#border-grad)" stroke-width="1" stroke-opacity="0.35" />

  <!-- Top Window Header Bar -->
  <path d="M12 24C12 17.3726 17.3726 12 24 12H896C902.627 12 908 17.3726 908 24V46H12V24Z" fill="#080C16" fill-opacity="0.7" />
  <line x1="12" y1="46" x2="908" y2="46" stroke="#1E293B" stroke-width="1" />

  <!-- Window Control Buttons -->
  <circle cx="34" cy="29" r="5.5" fill="#EF4444" fill-opacity="0.85" />
  <circle cx="52" cy="29" r="5.5" fill="#F59E0B" fill-opacity="0.85" />
  <circle cx="70" cy="29" r="5.5" fill="#10B981" fill-opacity="0.85" />

  <!-- Terminal Title -->
  <text x="460" y="33" text-anchor="middle" class="font-mono" font-size="11" fill="#64748B" letter-spacing="1">anirban@workstation: ~/portfolio-v2 (main)</text>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(696, 20)">
    <rect width="194" height="20" rx="10" fill="#064E3B" fill-opacity="0.6" stroke="#059669" stroke-width="0.8" />
    <circle cx="12" cy="10" r="3.5" fill="#10B981" class="pulsing-dot" />
    <text x="22" y="13.5" class="font-mono" font-size="9.5" font-weight="600" fill="#34D399" letter-spacing="0.5">OPEN TO SDE INTERNSHIPS</text>
  </g>

  <!-- Left Column: Identity & Impact -->
  <!-- Eyebrow prompt -->
  <g transform="translate(36, 75)">
    <text class="font-mono" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="1">$ whoami</text>
    <text x="78" y="0" class="font-mono" font-size="12" fill="#64748B">--role software-engineer --undergrad cs</text>
  </g>

  <!-- Name -->
  <text x="36" y="128" class="font-sans" font-size="38" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.8">Anirban Chatterjee</text>

  <!-- Role Subtitle with Gradient -->
  <text x="36" y="156" class="font-sans" font-size="16" font-weight="600" fill="url(#cyan-grad)" letter-spacing="0.2">Full-Stack Software Engineer · EVM Protocols &amp; Computer Vision</text>

  <!-- Description Narrative -->
  <text x="36" y="186" class="font-sans" font-size="13" fill="#94A3B8">
    CS undergraduate with demonstrated ownership from smart contract state machines
  </text>
  <text x="36" y="205" class="font-sans" font-size="13" fill="#94A3B8">
    to real-time YOLOv8 computer-vision inference and production full-stack systems.
  </text>

  <!-- Tech Badges / Pills Row -->
  <g transform="translate(36, 230)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="76" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
      <text x="38" y="15.5" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#E2E8F0">Solidity</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(84, 0)">
      <rect width="115" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
      <text x="57.5" y="15.5" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#E2E8F0">Arbitrum L2</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(207, 0)">
      <rect width="80" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
      <text x="40" y="15.5" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#E2E8F0">Next.js</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(295, 0)">
      <rect width="74" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
      <text x="37" y="15.5" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#E2E8F0">FastAPI</text>
    </g>
    <!-- Tag 5 -->
    <g transform="translate(377, 0)">
      <rect width="80" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
      <text x="40" y="15.5" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#E2E8F0">YOLOv8</text>
    </g>
    <!-- Tag 6 -->
    <g transform="translate(465, 0)">
      <rect width="95" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
      <text x="47.5" y="15.5" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#E2E8F0">TypeScript</text>
    </g>
  </g>

  <!-- Terminal Bottom Prompt -->
  <g transform="translate(36, 290)">
    <text class="font-mono" font-size="12" fill="#10B981">➜</text>
    <text x="16" y="0" class="font-mono" font-size="12" fill="#38BDF8">portfolio</text>
    <text x="90" y="0" class="font-mono" font-size="12" fill="#E2E8F0">git:(main)</text>
    <text x="166" y="0" class="font-mono" font-size="12" fill="#94A3B8">echo "Shipping production software with zero fluff."</text>
  </g>

  <!-- Right Column: System Specs Card -->
  <g transform="translate(606, 75)">
    <rect width="280" height="224" rx="10" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1" />

    <!-- Card Header -->
    <path d="M0 10C0 4.47715 4.47715 0 10 0H270C275.523 0 280 4.47715 280 10V32H0V10Z" fill="#0F172A" fill-opacity="0.6" />
    <text x="16" y="20" class="font-mono" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="1">CORE SPECIFICATIONS</text>
    <line x1="0" y1="32" x2="280" y2="32" stroke="#1E293B" stroke-width="1" />

    <!-- Spec Row 1: Academic Standing -->
    <g transform="translate(16, 52)">
      <text class="font-mono" font-size="10" fill="#64748B">ACADEMICS</text>
      <text x="0" y="16" class="font-sans" font-size="12" font-weight="600" fill="#F1F5F9">B.Tech CSE Core · GPA 8.01/10</text>
      <text x="0" y="30" class="font-mono" font-size="10" fill="#38BDF8">Minor: Data Analytics (2028)</text>
    </g>

    <line x1="16" y1="94" x2="264" y2="94" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 2" />

    <!-- Spec Row 2: Industry Track -->
    <g transform="translate(16, 114)">
      <text class="font-mono" font-size="10" fill="#64748B">INDUSTRY EXPERIENCE</text>
      <text x="0" y="16" class="font-sans" font-size="12" font-weight="600" fill="#F1F5F9">YuvaIntern (Data Science)</text>
      <text x="0" y="30" class="font-sans" font-size="11" fill="#94A3B8">CodSoft (Full-Stack Engineer)</text>
    </g>

    <line x1="16" y1="156" x2="264" y2="156" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 2" />

    <!-- Spec Row 3: Flagships -->
    <g transform="translate(16, 176)">
      <text class="font-mono" font-size="10" fill="#64748B">FLAGSHIP BUILDS</text>
      <text x="0" y="16" class="font-sans" font-size="11.5" font-weight="600" fill="#38BDF8">MediTrace <tspan fill="#64748B">·</tspan> <tspan fill="#818CF8">Nourish</tspan> <tspan fill="#64748B">·</tspan> <tspan fill="#34D399">CryptoPay</tspan></text>
      <text x="0" y="30" class="font-mono" font-size="10" fill="#94A3B8">Arbitrum L2 · YOLOv8 · FastAPI</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="12" y="326" width="896" height="2" fill="url(#border-grad)" />
</svg>
